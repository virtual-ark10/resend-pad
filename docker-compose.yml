# Email pad + leads engine - single compose file, two services, ONE store.
#
# Same file runs on a laptop and on a VPS: `docker compose up -d --build`.
# Moving hosts = copy this directory (or the image + .env + config.json + data/)
# and run the same command.
#
# Deliberately published on 127.0.0.1 only. A reverse proxy on the host
# terminates TLS and proxies to the pad, so the repo's add_caddy_route.py keeps
# working unchanged:
#   python3 add_caddy_route.py --path /pad --port 3001
services:
  pad:
    build: .
    image: pad-kit:latest
    container_name: pad-kit
    restart: unless-stopped

    # Secrets and overrides. Never baked into the image (.env is gitignored).
    env_file:
      - .env
    environment:
      PORT: "3001"
      DATA_DIR: /app/data
      # The Leads tab proxies /api/crm/* to the engine below, injecting the
      # pad token server-side so the browser only ever holds one credential.
      CRM_HOST: leads
      CRM_PORT: "3002"

    ports:
      # Host port is parameterised so several pads can coexist on one host:
      # set PAD_HOST_PORT in .env. Container always listens on 3001.
      - "127.0.0.1:${PAD_HOST_PORT:-3001}:3001"

    volumes:
      # The queue, the SQLite store and logs. A bind mount (not a named volume)
      # so the whole pad moves to a new VPS by copying this one folder.
      - ./data:/app/data
      # Branding/templates, editable without a rebuild.
      - ./config.json:/app/config.json:ro

    # Hardening: no root filesystem writes, no capabilities, no privilege gain.
    # The app only writes inside /app/data (and /tmp for node internals).
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Resource ceiling. The pad measures ~18 MiB RSS / ~0% CPU idle, so these
    # are generous; they exist because a small host may have no swap, and there
    # an unbounded spike means the OOM killer picks a victim - possibly a more
    # important service sharing the box.
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 128

    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Leads engine (CRM). Same image, same data volume, so it reads and writes the
  # very same pad.db - one store, not two copies to reconcile. Disable the whole
  # thing with config.json: { "leads": { "enabled": false } }.
  leads:
    build: .
    image: pad-kit:latest
    container_name: pad-kit-leads
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3002"
      DATA_DIR: /app/data
      PAD_URL: http://pad:3001
      SERVICE_NAME: leads
      LEADPAD_CONFIG: /app/config.json
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    command: ["node", "leads/server.cjs"]
    # The pad creates/migrates the shared store first.
    depends_on:
      - pad
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 96
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
